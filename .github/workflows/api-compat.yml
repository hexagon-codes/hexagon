name: API Compatibility

# 用 gorelease 对照上一个 tag 检测导出 API 的破坏式变更，提示 SemVer 应升 major/minor。
# v0.x 阶段为提示性（不硬失败）；v1.0 后改为破坏式变更即 CI 红。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gorelease:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.25.x' }
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260727155853-b88d891fe743
      - name: Check API compatibility
        run: gorelease || echo "::warning::gorelease 报告了 API 变更，请确认 SemVer 版本号相应升级"
