name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: off
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # 最低版本跟随模块声明，避免工作流与 go.mod 漂移。
          - go: 'minimum'
            quality: true
            race: false
          # 最新稳定版承担竞态与漏洞检测，及时采用标准库修复。
          - go: 'stable'
            quality: false
            race: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: go.mod
          check-latest: ${{ matrix.go == 'stable' }}
          cache-dependency-path: go.sum

      - name: Check formatting
        if: matrix.quality
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files are not gofmt formatted:\n%s\n' "$unformatted"
            exit 1
          fi

      # 只读模块模式保留依赖解析与校验；多余的历史校验和不影响构建。
      # 在测试编译阶段执行完整 vet，避免单独加载和检查同一批包。
      - name: Vet and test
        if: ${{ !matrix.race }}
        run: go test -count=1 -vet=all ./...

      - name: Test with race detector
        if: matrix.race
        run: go test -count=1 -race ./...

      - name: Install govulncheck
        if: matrix.race
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Check vulnerabilities
        if: matrix.race
        run: govulncheck ./...
